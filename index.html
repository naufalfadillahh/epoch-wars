 for(const a of d.U){if(!Array.isArray(a))continue;const id=a[0]|0;let u=null;for(const x of G.units)if(x.id===id){u=x;break}
  if(!u){if(G.ghosts.has(id))continue;const age=clamp(a[2]|0,0,3),def=AGES[age].units[clamp(a[3]|0,0,3)];
   u={id,team:a[1]?1:0,def,age,x:+a[4]||0,y:+a[5]||GROUND,hp:def.hp,maxHp:def.hp,walk:rand(0,6),atkT:0,atkDur:.4,moving:false,flash:0,w:def.w,h:def.h,time:rand(0,9),stomp:0};
   G.units.push(u);if(Math.abs(u.x-G.players[u.team].baseX)<140)spawnFx(u)}
  u.tx=+a[4]||0;u.y=+a[5]||GROUND;u.hp=+a[6]||0;const at=(a[7]|0)/100;if(at>u.atkT+.08)u.atkT=at;u.atkDur=Math.max(.05,(a[8]|0)/100);u.moving=!!a[9];if(a[10])u.flash=1;seen.add(id)}
 G.units=G.units.filter(u=>{if(seen.has(u.id))return true;G.ghosts.set(u.id,{u,t:G.time});return false});
}
function applyFx(list){if(!Array.isArray(list)||G.state==='lobby'||G.state==='menu')return;for(const e of list){if(Array.isArray(e))try{fxApply(e)}catch(err){}}}
function fxApply(e){const pl=i=>G.players[i?1:0],tg=id=>id===-1||id===-2?G.players[-1-id]:id>=0?findUnit(id):null;
 switch(e[0]){
 case'an':announce(String(e[1]).slice(0,40),String(e[2]||'').slice(0,60),String(e[3]).slice(0,9),Math.min(99,+e[4]||2));break;
 case'p':{const team=e[1]?1:0,type=String(e[2]);if(!PSPEED[type]&&type!=='beam'&&type!=='ion')return;let t=tg(e[7]|0);if(t&&!t.isBase&&t.hp<=0)t=null;
  shoot(team,type,+e[3],+e[4],t,0,+e[8]||0,-1,+e[5],+e[6]);if(e[9]>=0){const u=findUnit(e[9]);if(u)rangedFx(u,+e[3],+e[4])}else if(e[9]===-2)turretFireFx(pl(team),+e[3],+e[4]);break}
 case'h':{const u=findUnit(e[1]|0),t=tg(e[2]|0);if(u&&t)meleeFx(u,t);break}
 case'k':{const u=findUnit(e[1]|0);if(u){u.hp=0;G.units=G.units.filter(x=>x!==u);G.ghosts.set(u.id,{u,t:G.time});killFx(u,e[2]?1:0,e[3]|0)}break}
 case'sb':slotFx(pl(e[1]));break;
 case'ts':sellFx(pl(e[1]),e[2]|0);break;
 case'em':showEmote(e[1]?1:0,e[2]|0);break;
 case'tb':turretFx(pl(e[1]));break;
 case'ev':evolveFx(pl(e[1]));break;
 case'ul':if(Array.isArray(e[2]))ultRun(pl(e[1]),e[2].slice(0,100).map(v=>clamp(+v||0,0,WW)));break;
 case'end':{const b=pl(e[1]);if(G.state==='play'){b.hp=0;baseDestroyed(b)}break}
 }
}
const EMO_BTNS=(()=>{const o=[],w=56,g=6,x0=VW/2-(w*5+g*4)/2;for(let pi=0;pi<2;pi++)for(let i=0;i<5;i++)o.push({pi,em:i,x:x0+i*(w+g),y:pi?970:904,w,h:w});return o})();

 for(const e of G.emotes){const P=G.players[e.team];if(!P)continue;const T=TEAM[e.team],age=e.max-e.life,k=clamp(age/.18,0,1),sc=k<1?eOut(k)*1.15:1+.15*Math.max(0,1-(age-.18)/.12),a=clamp(e.life/.4,0,1);

  c.restore()}

const SELL_BTNS=BUTTONS.filter(b=>b.i===4).flatMap(b=>[{pi:b.pi,slot:1,x:b.x-24,y:b.y-42,w:b.w+48,h:34},{pi:b.pi,sell:1,x:b.x-24,y:b.y-82,w:b.w+48,h:34}]);

  c.globalAlpha=!ok?.35:can?1:.55;c.fillStyle=hov&&ok&&can?'#3a3a4a':bg;rrect(c,b.x,b.y,b.w,b.h,8);c.fill();c.lineWidth=2;c.strokeStyle=col;c.stroke();txt(c,t,b.x+b.w/2,b.y+b.h/2+1,'700 15px '+FH,col,'center')}c.globalAlpha=1}
function localAct(pi,kind,idx){
 if(G.mode!=='online'){act(G.players[pi],kind,idx);return}
 const me=myIdx();if(me<0||G.state!=='play')return;const P=G.players[me];
 if(me===0){act(P,kind,idx);return}
 const A_=AGES[P.age];let ok=true;
 if(kind==='u')ok=P.gold>=A_.units[idx].cost&&P.cds[idx]<=0;else if(kind==='t')ok=((n,sl)=>n<sl&&P.gold>=A_.turret.cost)(P.turret&&P.turret.age>=P.age?(P.turret.n||1):0,P.slots||1);else if(kind==='x')ok=P.ultCd<=0;else if(kind==='e')ok=P.age<3&&P.xp>=A_.evo;else if(kind==='s')ok=!!P.turret;else if(kind==='w')ok=(P.slots||1)<TMAX&&P.gold>=SLOT_COST[P.slots||1];
 if(!ok){S.deny();return}
 G.net.nr.emit('cmd',{k:kind,i:idx|0}).catch(()=>{});if(kind==='u')P.cds[idx]=A_.units[idx].cd;
}
function lobbyButtons(){const L=[{id:'back',x:60,y:50,w:220,h:76,t:'KEMBALI',s:'Esc'}];if(!G.room)return L;

 else L.push({id:'host',x:VW/2-600,y:640,w:480,h:96,t:'BUAT PERTANDINGAN',s:'Kamu jadi Pemain 1 (biru)'});
 if(!N)L.push({id:'code',x:VW/2+120,y:640,w:480,h:96,t:'MASUKKAN KODE',s:'Ketik kode dari temanmu'});
 if(!N){const hosts=G.room.peers().filter(p=>!p.isMe&&p.presence&&typeof p.presence.host==='string'&&/^[A-Z0-9]{4}$/.test(p.presence.host)).slice(0,2);

 return L}

  if(!btns.some(b=>b.id==='join')&&!N){(G.room.lan?['Belum ada pertandingan terbuka.','Pertandingan temanmu akan muncul','di sini otomatis, atau ketik kodenya.']:['Minta kode 4 huruf dari temanmu,','lalu klik tombol di bawah','dan ketik kodenya.']).forEach((l,i)=>txt(c,l,VW/2+120,440+i*38,`600 24px ${FH}`,'rgba(240,226,208,.7)','left'))}
  txt(c,'Pemain 1 menjalankan pertempuran. Biarkan tab game tetap terbuka dan aktif selama bermain.',VW/2,810,`600 21px ${FH}`,'rgba(255,230,200,.65)','center');
 }
 if(G.lobbyMsg)txt(c,G.lobbyMsg,VW/2,870,`700 26px ${FH}`,'#ffd45a','center',4);

/* ================= INPUT ================= */
function act(P,kind,idx){if(!P||P.ai||G.state!=='play'||(G.paused&&!G.net))return;if(kind==='u')spawnUnit(P,idx);else if(kind==='t')buyTurret(P);else if(kind==='x')useUlt(P);else if(kind==='e')evolve(P);else if(kind==='s')sellTurret(P);else if(kind==='w')buySlot(P)}
addEventListener('keydown',e=>{
 audioInit();const code=e.code;
 if(code==='F3'){FP.on=!FP.on;e.preventDefault();return}
 if(code==='KeyM'){A.muted=!A.muted;if(A.master)A.master.gain.value=A.muted?0:.9;return}
 if(G.state==='menu'){if(code==='Digit1'||code==='Numpad1'||code==='Enter'){S.click();startGame('duel')}else if(code==='Digit2'||code==='Numpad2'){S.click();startGame('ai')}else if(code==='Digit3'||code==='Numpad3'){S.click();openLobby()}return}
 if(G.state==='lobby'){if(code==='Escape'){leaveNet();G.state='menu'}return}
 if(G.state==='over'){if(code==='Enter'||code==='Space')overAgain();else if(code==='Escape'){leaveNet();startDemo()}return}
 if(code==='Escape'){if(G.state==='play'){G.paused=!G.paused;S.click()}return}
 if(G.state!=='play'||e.repeat)return;
 for(let pi=0;pi<2;pi++){const K=KEYS[pi];const ui=K.units.indexOf(code);if(ui>=0){localAct(pi,'u',ui);e.preventDefault()}else if(code===K.turret)localAct(pi,'t');else if(code===K.ult)localAct(pi,'x');else if(code===K.evo)localAct(pi,'e');else if(code===(pi?'KeyU':'KeyR'))localAct(pi,'s');else if(code===(pi?'KeyY':'KeyT'))localAct(pi,'w')}
 {const dg=/^Digit\d$/.test(code)?+code.slice(5):-1;if(dg>=1&&dg<=5)localEmote(0,dg-1,true);else if(dg===0||dg>=6)localEmote(1,(dg+4)%10,true)}
 if(NUMPAD[code]){const[k,i]=NUMPAD[code];localAct(1,k,i);e.preventDefault()}
 if(code==='Space'||code==='Semicolon')e.preventDefault();
});
function toV(e){const r=cv.getBoundingClientRect();const x=((e.clientX-r.left)*DPR-OX)/SC,y=((e.clientY-r.top)*DPR-OY)/SC;return[x,y]}

function overAgain(){if(G.mode!=='online'){startGame(G.mode);return}const N=G.net;if(N&&N.role==='host')netBegin();else if(N){N.nr.emit('cmd',{k:'again'}).catch(()=>{});announce('MENUNGGU','Pemain 1 harus setuju main lagi','#ffd9a8',3)}else{startDemo();openLobby()}}
function hitList(){if(G.state==='menu')return MENU_BTNS;if(G.state==='lobby')return lobbyButtons();if(G.state==='over')return OVER_BTNS;if(G.paused)return PAUSE_BTNS;if(G.state==='play')return BUTTONS.concat(EMO_BTNS,SELL_BTNS);return[]}
cv.addEventListener('pointermove',e=>{const[x,y]=toV(e);G.hover=hitList().find(b=>inR(b,x,y))||null;cv.style.cursor=G.hover?'pointer':'default'});

 if(b.id==='duel'){S.click();startGame('duel')}else if(b.id==='ai'){S.click();startGame('ai')}else if(b.id==='online'){S.click();openLobby()}else if(b.id==='again'){overAgain()}else if(b.id==='menu'){S.click();leaveNet();startDemo()}else if(b.id==='resume'){G.paused=false}

 else if(b.slot){if(G.mode==='online'&&b.pi!==myIdx())return;localAct(b.pi,'w')}
 else if(b.sell){if(G.mode==='online'&&b.pi!==myIdx())return;localAct(b.pi,'s')}
